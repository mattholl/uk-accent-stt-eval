[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ukstt"
description = "WER benchmark of ElevenLabs Scribe v2 across UK and Irish English dialect labels"
license = "MIT"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["requests==2.34.2"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "responses==0.26.3"]
notebook = ["pandas==3.1.0", "matplotlib==3.11.2", "jupyter==1.1.1", "nbformat==5.11.1"]

[project.scripts]
ukstt = "ukstt.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ukstt.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
